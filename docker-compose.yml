x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
services:
  identifier:
    image: semtech/mu-identifier:1.11.0
    environment:
      DEFAULT_MU_AUTH_ALLOWED_GROUPS_HEADER: '[{"variables":[],"name":"public"}]'
      DEFAULT_ACCESS_CONTROL_ALLOW_ORIGIN_HEADER: "*"
      SESSION_COOKIE_SECURE: "true"
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  dispatcher:
    image: semtech/mu-dispatcher:2.1.0-beta.2
    volumes:
      - ./config/dispatcher:/config
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  database:
    image: semtech/sparql-parser:0.0.15
    environment:
      LISP_DYNAMIC_SPACE_SIZE: 8192
    volumes:
      - ./config/authorization:/config
      - ./data/authorization:/data
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  triplestore:
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
    volumes:
      - ./config/triplestore/virtuoso.ini:/data/virtuoso.ini
      - ./data/db:/data
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  resource:
    image: semtech/mu-cl-resources:1.27.2
    environment:
      CACHE_CLEAR_PATH: "http://cache/.mu/clear-keys"
    volumes:
      - ./config/resources:/config
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  cache:
    image: semtech/mu-cache:2.0.1
    links:
      - resource:backend
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  project-scripts:
    image: semtech/simple-script-store:1.0.0
    volumes:
      - ./scripts/project:/app/scripts/
    restart: "no"
  migrations:
    image: semtech/mu-migrations-service:0.9.0
    environment:
      MU_SPARQL_ENDPOINT: http://triplestore:8890/sparql
    restart: always
    volumes:
      - ./config/migrations:/data/migrations
  deltanotifier:
    image: nvdk/mu-delta-notifier:1.1.0
    volumes:
      - ./config/delta:/config
    environment:
      - LOG_SERVER_CONFIGURATION=true
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  sink:
    image: nginx:1.15.2
    volumes:
      - ./config/sink/sink.conf:/etc/nginx/conf.d/default.conf
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  ldes-client:
    image: lblod/ldes-client:feature-extra-hooks
    restart: always
    environment:
      WORKING_GRAPH: http://mu.semte.ch/graphs/ldes-working-graph
      DIRECT_DATABASE_CONNECTION: "http://triplestore:8890/sparql"
      GRAPH_STORE_URL: "http://triplestore:8890/sparql-graph-crud"
      RANDOMIZE_GRAPHS: true
      BATCH_SIZE: 100
      BYPASS_MU_AUTH: false
      LDES_METRICS_PUSHGATEWAY_URL: "http://pushgateway:9091"
    volumes:
      - ./config/ldes-client:/config
    labels:
      - "logging=true"
    logging: *default-logging
  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
  prometheus:
    image: prom/prometheus:v2.52.0
    user: "0:0"
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./config/prometheus:/etc/prometheus
      - ./data/prometheus:/prometheus
    labels:
      - "logging=true"
    logging: *default-logging
  grafana:
    image: grafana/grafana-oss:11.1.0
    user: "0:0"
    restart: always
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    labels:
      - "logging=true"
    logging: *default-logging
  ldes-watchman:
    image: lblod/ldes-watchman-service:0.0.1
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
    environment:
      SHAPE_CRON_PATTERN: "* * * * *"
    volumes:
      - ./data/ldes-watchman:/data/
      - ./config/ldes-watchman:/config/
  frontend:
    image: lblod/frontend-ldes-watchman:0.0.1
    labels:
      - "logging=true"
    logging: *default-logging
    restart: always
