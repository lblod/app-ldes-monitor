apiVersion: 1
groups:
  - orgId: 1
    name: LDES client alerts
    folder: LDES
    interval: 60s
    rules:
      - uid: ldes-stalled-heartbeat
        title: "LDES client: heartbeat stalled"
        condition: C
        for: 120s
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: No page fetch started for 5+ minutes on stream {{ $labels.stream }}
          description: The ldes-client has not started fetching a page on stream
            {{$labels.stream}} for more than 5 minutes. The stream may be
            stalled, dead or blocked.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: time() - ldes_last_page_fetch_start_timestamp_seconds
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              settings:
                mode: dropNN
                reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
              refId: C
      - uid: ldes-errors-increased
        title: "LDES client: errors increased"
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Errors increased on stream {{ $labels.stream }}
          description: ldes_errors_total increased by {{$values.B}} for stream
            {{$labels.stream}} in the last 10 minutes. See the ldes-watchman
            observation graph for details.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              editorMode: code
              expr: increase(ldes_errors_total[10m]) > 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              settings:
                mode: dropNN
                reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
              refId: C
      - uid: ldes-pages-completed-spike
        title: "LDES client: pages completed per hour spike"
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Pages completed per hour spiked on stream {{ $labels.stream }}
          description:
            The number of pages completed per hour on stream {{$labels.stream}}
            is more than 1000% of the average of last week ({{$values.B}}).
            Check the ldes stream for unusual activity or duplicate pages.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              editorMode: code
              expr: rate(ldes_pages_completed_total[1h]) * 3600 > 10 * avg_over_time(rate(ldes_pages_completed_total[1h])[1w:1h]) * 3600
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              settings:
                mode: dropNN
                reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
              refId: C

      - uid: ldes-shape-changed
        title: "LDES client: shape changed"
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Shape changed for {{ $labels.stream }}
          description:
            The ldes-watchman detected a shape change on {{$labels.stream}}
            in the last hour; a new shape report file was stored. Inspect GET
            /shape/diff?streamUri=... on the ldes-watchman to see what changed.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              editorMode: code
              expr: >
                ldes_watchman_shape_changes_total > 1
                and
                increase(ldes_watchman_shape_changes_total[1h]) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              settings:
                mode: dropNN
                reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
              refId: C
